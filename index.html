<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>m3u8在线播放器</title>
<link href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/css/amazeui.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css" rel="stylesheet">
<style>
body{text-align:center}header{margin:20px 0}header h1{width:280px;margin:0 auto}html{font-size:62.5%;font-family:'microsoft yahei',Simsun,sans-serif}blockquote,body,button,code,dd,div,dl,dt,fieldset,form,h1,h2,h3,h4,h5,h6,hr,input,legend,li,ol,p,pre,td,textarea,th,ul{margin:0;padding:0}h1,h2,h3,h4,h5,h6{font-size:100%;font-family:arial,'hiragino sans gb','microsoft yahei',Simsun,sans-serif}li{list-style:none}a:link,a:visited{text-decoration:none}body{font-size:12px;line-height:1.333}.clear{clear:both}.cont{width:1200px;margin:0 auto}#ckplays{height:650px;background:#eee}#footer{margin-top:30px;color:#111;text-align:center}@media screen and (min-width:0px) and (max-width:900px){.cont{width:auto;min-width:auto}.navigation-up .navigation-v3{margin:0}#ckplays{width:100%;min-height:260px;height:auto}.searchs .text{width:80%}}
</style>
</head>
<body>
<header>
	<h1><a href="/">m3u8在线播放器</a></h1>
</header>
<div class="cont">
  <div class="am-u-lg-12 am-margin-bottom-lg" style="padding:0;">
    <div class="am-input-group">
      <input type="text" class="am-form-field" name="url" id="url" placeholder="请输入支持https的m3u8地址">
      <span class="am-input-group-btn">
        <button class="am-btn am-btn-default" type="button" name="doplayers" id="doplayers">立即播放</button>
      </span>
    </div>
  </div>
  <div class="clear"></div>
  <div id="ckplays"></div>
  <p id="footer">© m3u8 Player</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<script>
var dp = null;

function doPlay(url) {
    if (!url) return;
    document.getElementById('url').value = url;

    if (dp) { dp.destroy(); dp = null; }

    dp = new DPlayer({
        container: document.getElementById('ckplays'),
        video: {
            url: url,
            type: 'hls',
        },
        autoplay: true,
    });

    document.getElementById('ckplays').style.height = 'auto';
}

// 点击播放
document.getElementById('doplayers').addEventListener('click', function() {
    doPlay(document.getElementById('url').value);
});

// 回车播放
document.getElementById('url').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doPlay(this.value);
});

// URL 参数自动播放: ?url=https://xxx.m3u8
(function() {
    var params = new URLSearchParams(location.search);
    var autoUrl = params.get('url') || location.hash.slice(1);
    if (autoUrl) doPlay(autoUrl);
})();
</script>
</body>
</html>
