<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>前端通用媒体测试</title>
<link href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/css/amazeui.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css" rel="stylesheet">
<style>
body{text-align:center}header{margin:20px 0}header h1{width:280px;margin:0 auto}html{font-size:62.5%;font-family:'microsoft yahei',Simsun,sans-serif}blockquote,body,button,code,dd,div,dl,dt,fieldset,form,h1,h2,h3,h4,h5,h6,hr,input,legend,li,ol,p,pre,td,textarea,th,ul{margin:0;padding:0}h1,h2,h3,h4{font-size:100%;font-family:arial,'hiragino sans gb','microsoft yahei',Simsun,sans-serif}li{list-style:none}a:link,a:visited{text-decoration:none}body{font-size:12px;line-height:1.333}.clear{clear:both}.cont{width:1200px;margin:0 auto}#ckplays{height:650px;background:#eee;position:relative}#footer{margin-top:30px;color:#111;text-align:center}@media screen and (min-width:0px) and (max-width:900px){.cont{width:auto;min-width:auto}#ckplays{width:100%;min-height:260px;height:auto}}
/* 免责声明（footer 区域） */
#footer{text-align:left;max-width:900px;margin:30px auto 0;padding:14px 20px;background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;font-size:12px;line-height:1.8;color:#8c6d1f}#footer strong{display:block;font-size:13px;margin-bottom:6px;color:#ad6800}#footer p{margin:0 0 4px}

/* ── 拖动进度提示浮层 ── */
#ckplays .drag-seek-hint{
  display:none;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:100;
  background:rgba(0,0,0,.72);
  color:#fff;
  padding:10px 22px;
  border-radius:8px;
  font-size:15px;
  font-family:arial,sans-serif;
  pointer-events:none;
  white-space:nowrap;
  user-select:none;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}
#ckplays .drag-seek-hint .seek-icon{
  font-size:18px;
  margin-right:4px;
  vertical-align:middle;
}
#ckplays .drag-seek-hint .seek-time{
  font-weight:bold;
  vertical-align:middle;
}
#ckplays .drag-seek-hint .seek-cur{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
  text-align:center;
}
/* 拖动时进度条高亮 */
#ckplays .drag-progress-bar{
  display:none;
  position:absolute;
  bottom:0;left:0;
  height:3px;
  background:rgba(79,195,247,.9);
  z-index:100;
  pointer-events:none;
  transition:width .05s linear;
}
</style>
</head>
<body>
<header>
	<h1><a href="/" style="text-decoration:none;color:inherit">前端通用媒体测试</a></h1>
</header>
<div class="cont">
  <div class="am-u-lg-12 am-margin-bottom-lg" style="padding:0;">
    <div class="am-input-group">
      <input type="text" class="am-form-field" name="url" id="url" placeholder="请输入支持https的m3u8地址">
      <span class="am-input-group-btn">
        <button class="am-btn am-btn-default" type="button" name="doplayers" id="doplayers">立即播放</button>
      </span>
    </div>
  </div>
  <div class="clear"></div>
  <div id="ckplays"></div>
  <div id="footer">
    <strong>免责声明</strong>
    <p>1. 本工具仅供流媒体技术开发、格式兼容性测试及学习研究使用，不得用于任何商业用途或非法目的。</p>
    <p>2. 用户输入的媒体地址及播放内容均由用户自行提供，本工具不存储、不缓存、不分发任何媒体内容。</p>
    <p>3. 用户须确保所播放的内容已获得合法授权，因使用本工具播放未授权内容而产生的一切法律责任，由用户自行承担，与本工具无关。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<script>
var dp = null;

/* ── 拖动进度配置 ── */
var DRAG_SEEK_CONFIG = {
  threshold: 10,       // 最小拖动距离(px)，低于此值不触发
  sensitivity: 0.5,    // 每拖动1px对应的秒数
  maxSeek: 120,        // 单次最大快进/快退秒数
};

/* ── 格式化时间 mm:ss ── */
function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function doPlay(url) {
    if (!url) return;
    document.getElementById('url').value = url;

    if (dp) { dp.destroy(); dp = null; }

    // 清空播放器区域，准备加载 DPlayer
    var container = document.getElementById('ckplays');
    container.innerHTML = '';

    dp = new DPlayer({
        container: container,
        video: {
            url: url,
            type: 'hls',
        },
        autoplay: true,
    });

    container.style.height = 'auto';

    // 等待 video 元素就绪后绑定拖动进度
    initDragSeek(container);
}

/* ── 初始化拖动进度控制 ── */
function initDragSeek(container) {
    // 创建提示浮层
    var hint = document.createElement('div');
    hint.className = 'drag-seek-hint';
    hint.innerHTML =
        '<span class="seek-icon"></span>' +
        '<span class="seek-time"></span>' +
        '<div class="seek-cur"></div>';
    container.appendChild(hint);

    // 创建底部进度条
    var progressBar = document.createElement('div');
    progressBar.className = 'drag-progress-bar';
    container.appendChild(progressBar);

    var dragging = false;
    var startX = 0;
    var startTime = 0;
    var duration = 0;
    var dragDx = 0;
    var seekSeconds = 0;

    function getVideo() {
        return container.querySelector('video');
    }

    function onDragStart(x) {
        var video = getVideo();
        if (!video || !video.duration || video.readyState < 1) return;
        dragging = true;
        startX = x;
        startTime = video.currentTime;
        duration = video.duration;
        dragDx = 0;
        seekSeconds = 0;
    }

    function onDragMove(x) {
        if (!dragging) return;
        dragDx = x - startX;
        // 每px对应的秒数，限制最大值
        seekSeconds = dragDx * DRAG_SEEK_CONFIG.sensitivity;
        if (seekSeconds > DRAG_SEEK_CONFIG.maxSeek) seekSeconds = DRAG_SEEK_CONFIG.maxSeek;
        if (seekSeconds < -DRAG_SEEK_CONFIG.maxSeek) seekSeconds = -DRAG_SEEK_CONFIG.maxSeek;

        var targetTime = startTime + seekSeconds;
        if (targetTime < 0) { targetTime = 0; seekSeconds = -startTime; }
        if (targetTime > duration) { targetTime = duration; seekSeconds = duration - startTime; }

        // 更新提示
        var iconEl = hint.querySelector('.seek-icon');
        var timeEl = hint.querySelector('.seek-time');
        var curEl = hint.querySelector('.seek-cur');

        if (seekSeconds > 0) {
            iconEl.textContent = '▶▶';
            timeEl.textContent = '+' + seekSeconds.toFixed(1) + 's';
        } else if (seekSeconds < 0) {
            iconEl.textContent = '◀◀';
            timeEl.textContent = seekSeconds.toFixed(1) + 's';
        } else {
            iconEl.textContent = '||';
            timeEl.textContent = '0s';
        }
        curEl.textContent = formatTime(targetTime) + ' / ' + formatTime(duration);

        hint.style.display = 'block';

        // 更新底部进度条
        var pct = (targetTime / duration) * 100;
        progressBar.style.width = pct + '%';
        progressBar.style.display = 'block';
    }

    function onDragEnd() {
        if (!dragging) return;
        dragging = false;

        // 应用跳转
        var video = getVideo();
        if (video && Math.abs(seekSeconds) >= DRAG_SEEK_CONFIG.threshold * DRAG_SEEK_CONFIG.sensitivity) {
            video.currentTime = startTime + seekSeconds;
        }

        // 隐藏提示
        hint.style.display = 'none';
        progressBar.style.display = 'none';
        seekSeconds = 0;
        dragDx = 0;
    }

    // ── Touch 事件 ──
    container.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        onDragStart(e.touches[0].clientX);
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        if (dragging) e.preventDefault(); // 拖动中阻止默认滚动
        onDragMove(e.touches[0].clientX);
    }, { passive: false });

    container.addEventListener('touchend', function() {
        onDragEnd();
    }, { passive: true });

    container.addEventListener('touchcancel', function() {
        onDragEnd();
    }, { passive: true });

    // ── Mouse 事件（桌面端兼容） ──
    container.addEventListener('mousedown', function(e) {
        onDragStart(e.clientX);
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        onDragMove(e.clientX);
    });

    document.addEventListener('mouseup', function() {
        if (dragging) onDragEnd();
    });
}

// 点击播放
document.getElementById('doplayers').addEventListener('click', function() {
    doPlay(document.getElementById('url').value);
});

// 回车播放
document.getElementById('url').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doPlay(this.value);
});

// Hash 自动播放: #https://xxx.m3u8
(function() {
    var autoUrl = location.hash.slice(1);
    if (autoUrl) doPlay(autoUrl);
})();
</script>
</body>
</html>
