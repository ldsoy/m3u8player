<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>前端通用媒体测试</title>
<link href="https://cdn.jsdelivr.net/npm/amazeui@2.7.2/css/amazeui.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css" rel="stylesheet">
<style>
body{text-align:center}header{margin:20px 0}header h1{width:280px;margin:0 auto}html{font-size:62.5%;font-family:'microsoft yahei',Simsun,sans-serif}blockquote,body,button,code,dd,div,dl,dt,fieldset,form,h1,h2,h3,h4,h5,h6,hr,input,legend,li,ol,p,pre,td,textarea,th,ul{margin:0;padding:0}h1,h2,h3,h4{font-size:100%;font-family:arial,'hiragino sans gb','microsoft yahei',Simsun,sans-serif}li{list-style:none}a:link,a:visited{text-decoration:none}body{font-size:12px;line-height:1.333}.clear{clear:both}.cont{width:1200px;margin:0 auto}#ckplays{height:650px;background:#eee;position:relative}#footer{margin-top:30px;color:#111;text-align:center}@media screen and (min-width:0px) and (max-width:900px){.cont{width:auto;min-width:auto}#ckplays{width:100%;min-height:260px;height:auto}}
/* 免责声明（footer 区域） */
#footer{text-align:left;max-width:900px;margin:30px auto 0;padding:14px 20px;background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;font-size:12px;line-height:1.8;color:#8c6d1f}#footer strong{display:block;font-size:13px;margin-bottom:6px;color:#ad6800}#footer p{margin:0 0 4px}

/* ── 拖动进度提示浮层 ── */
#ckplays .drag-seek-hint{
  display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:100;background:rgba(0,0,0,.72);color:#fff;padding:10px 22px;border-radius:8px;
  font-size:15px;font-family:arial,sans-serif;pointer-events:none;white-space:nowrap;
  user-select:none;box-shadow:0 2px 12px rgba(0,0,0,.4);
}
#ckplays .drag-seek-hint .seek-icon{font-size:18px;margin-right:4px;vertical-align:middle}
#ckplays .drag-seek-hint .seek-time{font-weight:bold;vertical-align:middle}
#ckplays .drag-seek-hint .seek-cur{font-size:12px;color:#aaa;margin-top:4px;text-align:center}
/* 拖动时进度条高亮 */
#ckplays .drag-progress-bar{
  display:none;position:absolute;bottom:0;left:0;height:3px;
  background:rgba(79,195,247,.9);z-index:100;pointer-events:none;transition:width .05s linear;
}

/* ── 隐藏 DPlayer 长按弹出的视频统计信息 ── */
.dplayer-info{display:none!important}
.dplayer-info-panel{display:none!important}

/* ── 右侧悬浮按钮（倍速 + 锁定） ── */
#ckplays .side-controls{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  z-index:50;display:flex;flex-direction:column;gap:10px;
}
#ckplays .side-controls .sc-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(0,0,0,.4);color:#fff;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;font-family:arial,sans-serif;
}
#ckplays .side-controls .sc-btn:active{background:rgba(0,0,0,.6)}

/* ── 锁定遮罩 ── */
#ckplays .lock-mask{
  display:none;position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:200;cursor:pointer;
}
#ckplays .lock-mask .lock-tip{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.7);font-size:13px;background:rgba(0,0,0,.45);
  padding:8px 16px;border-radius:16px;pointer-events:none;
  animation:lock-fade 2s ease-out forwards;
}
@keyframes lock-fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<header>
	<h1><a href="/" style="text-decoration:none;color:inherit">前端通用媒体测试</a></h1>
</header>
<div class="cont">
  <div class="am-u-lg-12 am-margin-bottom-lg" style="padding:0;">
    <div class="am-input-group">
      <input type="text" class="am-form-field" name="url" id="url" placeholder="请输入支持https的m3u8地址">
      <span class="am-input-group-btn">
        <button class="am-btn am-btn-default" type="button" name="doplayers" id="doplayers">立即播放</button>
      </span>
    </div>
  </div>
  <div class="clear"></div>
  <div id="ckplays"></div>
  <div id="footer">
    <strong>免责声明</strong>
    <p>1. 本工具仅供流媒体技术开发、格式兼容性测试及学习研究使用，不得用于任何商业用途或非法目的。</p>
    <p>2. 用户输入的媒体地址及播放内容均由用户自行提供，本工具不存储、不缓存、不分发任何媒体内容。</p>
    <p>3. 用户须确保所播放的内容已获得合法授权，因使用本工具播放未授权内容而产生的一切法律责任，由用户自行承担，与本工具无关。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<script>
var dp = null;
var isLocked = false;
var currentSpeedIdx = 2; // 默认 1.0x
var speedList = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0];

/* ── 拖动进度配置 ── */
var DRAG_SEEK_CONFIG = {
  threshold: 10,       // 最小拖动距离(px)，低于此值不触发
  sensitivity: 0.5,    // 每拖动1px对应的秒数
};

/* ── 格式化时间 mm:ss ── */
function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function doPlay(url) {
    if (!url) return;
    document.getElementById('url').value = url;

    if (dp) { dp.destroy(); dp = null; }

    var container = document.getElementById('ckplays');
    container.innerHTML = '';

    dp = new DPlayer({
        container: container,
        video: {
            url: url,
            type: 'hls',
        },
        autoplay: true,
    });

    container.style.height = 'auto';

    // 重置状态
    isLocked = false;
    currentSpeedIdx = 2;

    initDragSeek(container);
    initSideControls(container);
    disableDPlayerInfo(container);
}

/* ── 隐藏 DPlayer 长按弹出的视频统计/作者信息 ── */
function disableDPlayerInfo(container) {
    // 移除 DPlayer 的 info 相关元素
    setTimeout(function() {
        var infoPanel = container.querySelector('.dplayer-info');
        if (infoPanel) infoPanel.remove();
    }, 100);
    // 阻止 DPlayer 的 contextmenu 事件（也触发统计信息）
    container.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
}

/* ── 拖动进度控制 ── */
function initDragSeek(container) {
    var hint = document.createElement('div');
    hint.className = 'drag-seek-hint';
    hint.innerHTML =
        '<span class="seek-icon"></span>' +
        '<span class="seek-time"></span>' +
        '<div class="seek-cur"></div>';
    container.appendChild(hint);

    var progressBar = document.createElement('div');
    progressBar.className = 'drag-progress-bar';
    container.appendChild(progressBar);

    var dragging = false;
    var startX = 0;
    var startTime = 0;
    var duration = 0;
    var seekSeconds = 0;

    function getVideo() {
        return container.querySelector('video');
    }

    function onDragStart(x) {
        if (isLocked) return;
        var video = getVideo();
        if (!video || !video.duration || video.readyState < 1) return;
        dragging = true;
        startX = x;
        startTime = video.currentTime;
        duration = video.duration;
        seekSeconds = 0;
    }

    function onDragMove(x) {
        if (!dragging) return;
        // 不限制最大快进/快退
        seekSeconds = (x - startX) * DRAG_SEEK_CONFIG.sensitivity;

        var targetTime = startTime + seekSeconds;
        if (targetTime < 0) { targetTime = 0; seekSeconds = -startTime; }
        if (targetTime > duration) { targetTime = duration; seekSeconds = duration - startTime; }

        var iconEl = hint.querySelector('.seek-icon');
        var timeEl = hint.querySelector('.seek-time');
        var curEl = hint.querySelector('.seek-cur');

        if (seekSeconds > 0) {
            iconEl.textContent = '▶▶';
            timeEl.textContent = '+' + seekSeconds.toFixed(1) + 's';
        } else if (seekSeconds < 0) {
            iconEl.textContent = '◀◀';
            timeEl.textContent = seekSeconds.toFixed(1) + 's';
        } else {
            iconEl.textContent = '||';
            timeEl.textContent = '0s';
        }
        curEl.textContent = formatTime(targetTime) + ' / ' + formatTime(duration);
        hint.style.display = 'block';

        var pct = (targetTime / duration) * 100;
        progressBar.style.width = pct + '%';
        progressBar.style.display = 'block';
    }

    function onDragEnd() {
        if (!dragging) return;
        dragging = false;
        var video = getVideo();
        if (video && Math.abs(seekSeconds) >= DRAG_SEEK_CONFIG.threshold * DRAG_SEEK_CONFIG.sensitivity) {
            video.currentTime = startTime + seekSeconds;
        }
        hint.style.display = 'none';
        progressBar.style.display = 'none';
        seekSeconds = 0;
    }

    // ── Touch 事件 ──
    container.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        // 阻止事件冒泡，防止触发 DPlayer 的长按统计信息
        e.stopPropagation();
        onDragStart(e.touches[0].clientX);
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        if (dragging) e.preventDefault();
        e.stopPropagation();
        onDragMove(e.touches[0].clientX);
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
        e.stopPropagation();
        onDragEnd();
    }, { passive: true });

    container.addEventListener('touchcancel', function(e) {
        e.stopPropagation();
        onDragEnd();
    }, { passive: true });

    // ── Mouse 事件（桌面端兼容） ──
    container.addEventListener('mousedown', function(e) { e.stopPropagation(); onDragStart(e.clientX); });
    document.addEventListener('mousemove', function(e) { if (dragging) onDragMove(e.clientX); });
    document.addEventListener('mouseup', function() { if (dragging) onDragEnd(); });
}

/* ── 右侧按钮：倍速 + 锁定 ── */
function initSideControls(container) {
    var speedBtn = document.createElement('button');
    speedBtn.className = 'sc-btn';
    speedBtn.title = '倍速';
    speedBtn.textContent = speedList[currentSpeedIdx] + 'X';

    var lockBtn = document.createElement('button');
    lockBtn.className = 'sc-btn';
    lockBtn.title = '锁定';
    lockBtn.innerHTML = '&#128274;';

    var sideBar = document.createElement('div');
    sideBar.className = 'side-controls';
    sideBar.appendChild(speedBtn);
    sideBar.appendChild(lockBtn);
    container.appendChild(sideBar);

    // 锁定遮罩
    var lockMask = document.createElement('div');
    lockMask.className = 'lock-mask';
    container.appendChild(lockMask);

    // ── 倍速切换 ──
    speedBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isLocked) return;
        var video = container.querySelector('video');
        if (!video) return;
        currentSpeedIdx = (currentSpeedIdx + 1) % speedList.length;
        var sp = speedList[currentSpeedIdx];
        video.playbackRate = sp;
        speedBtn.textContent = sp + 'X';
    });

    // ── 锁定/解锁 ──
    lockBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        isLocked = !isLocked;
        if (isLocked) {
            lockMask.style.display = 'block';
            lockBtn.innerHTML = '&#128275;';
            lockBtn.title = '解锁';
            speedBtn.style.display = 'none';
            lockMask.innerHTML = '<span class="lock-tip">已锁定 · 点击任意位置解锁</span>';
        } else {
            lockMask.style.display = 'none';
            lockBtn.innerHTML = '&#128274;';
            lockBtn.title = '锁定';
            speedBtn.style.display = 'flex';
        }
    });

    // 点击遮罩解锁
    lockMask.addEventListener('click', function(e) {
        e.stopPropagation();
        isLocked = false;
        lockMask.style.display = 'none';
        lockBtn.innerHTML = '&#128274;';
        lockBtn.title = '锁定';
        speedBtn.style.display = 'flex';
    });
}

// 点击播放
document.getElementById('doplayers').addEventListener('click', function() {
    doPlay(document.getElementById('url').value);
});

// 回车播放
document.getElementById('url').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doPlay(this.value);
});

// Hash 自动播放: #https://xxx.m3u8
(function() {
    var autoUrl = location.hash.slice(1);
    if (autoUrl) doPlay(autoUrl);
})();
</script>
</body>
</html>
